<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <title>Outside Now</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                background: #111;
                overflow: hidden;
                touch-action: none;
            }
            canvas {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
            }
            #info {
                position: fixed;
                bottom: max(14px, env(safe-area-inset-bottom, 14px));
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.55);
                font: 11px/1.6 "Courier New", monospace;
                letter-spacing: 0.08em;
                text-align: center;
                pointer-events: none;
                z-index: 10;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <div id="info">Locating…</div>
        <script>
            /* ─── weather data ────────────────────────────────────────────── */
            async function fetchWeather(lat, lon) {
                const url = [
                    "https://api.open-meteo.com/v1/forecast",
                    `?latitude=${lat}&longitude=${lon}`,
                    "&current=temperature_2m,precipitation,weather_code,cloud_cover",
                    ",wind_speed_10m,wind_direction_10m,is_day",
                    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto",
                ].join("");
                const r = await fetch(url);
                const d = await r.json();
                return d.current;
            }

            function getGPSLocation() {
                return new Promise((res, rej) => {
                    if (!navigator.geolocation) return rej(new Error("no-geo"));
                    navigator.geolocation.getCurrentPosition(res, rej, {
                        timeout: 8000,
                    });
                });
            }

            async function getIPLocation() {
                // Free, no-key IP geolocation — returns lat/lon for the public IP
                const r = await fetch("https://ipapi.co/json/");
                const d = await r.json();
                if (!d.latitude) throw new Error("ip-geo-failed");
                return {
                    lat: d.latitude,
                    lon: d.longitude,
                    city: d.city,
                    region: d.region,
                };
            }

            async function resolveLocation() {
                // 1. Try precise GPS
                try {
                    const pos = await getGPSLocation();
                    return {
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        source: "gps",
                    };
                } catch (gpsErr) {
                    console.info(
                        "GPS unavailable:",
                        gpsErr.message,
                        "— trying IP geolocation",
                    );
                }
                // 2. Fall back to IP geolocation
                const ip = await getIPLocation(); // throws if this also fails
                return {
                    lat: ip.lat,
                    lon: ip.lon,
                    city: ip.city,
                    region: ip.region,
                    source: "ip",
                };
            }

            async function init() {
                let w = defaultWeather();
                let locStr = "default location";
                try {
                    let lat, lon, place;

                    if (location.protocol === "file:") {
                        // Geolocation and IP lookups are blocked on file:// — use hardcoded zip 27613
                        lat = 35.9049;
                        lon = -78.7003;
                        place = "Raleigh, NC (27613)";
                        // lat = 37.7749; lon = 122.4194; place = 'San Francisco, CA';
                        // lat = 51.5074; lon = 0.1278; place = 'London, England';
                    } else {
                        const loc = await resolveLocation();
                        lat = loc.lat;
                        lon = loc.lon;
                        place = loc.city
                            ? `${loc.city}${loc.region ? ", " + loc.region : ""}`
                            : `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
                    }

                    const cur = await fetchWeather(lat, lon);
                    w = {
                        temp: cur.temperature_2m,
                        windSpeed: cur.wind_speed_10m,
                        windDir: cur.wind_direction_10m,
                        cloudCover: cur.cloud_cover,
                        precip: cur.precipitation,
                        code: cur.weather_code,
                        isDay: cur.is_day,
                        lat,
                        lon,
                    };
                    locStr = `${place} · ${Math.round(w.temp)}°F · ${Math.round(w.windSpeed)} mph`;
                } catch (e) {
                    console.warn("Could not fetch weather:", e);
                    locStr = "weather unavailable — showing default";
                }
                document.getElementById("info").textContent = locStr;
                startSketch(w);
            }

            function defaultWeather() {
                return {
                    temp: 68,
                    windSpeed: 8,
                    windDir: 225,
                    cloudCover: 25,
                    precip: 0,
                    code: 1,
                    isDay: 1,
                    lat: 40,
                    lon: -74,
                };
            }

            /* ─── p5 sketch ────────────────────────────────────────────────── */
            function startSketch(w) {
                new p5((sk) => {
                    /* canvas */
                    const W = 900,
                        H = 560;
                    const GND = H * 0.615; // horizon y

                    /* weather */
                    const {
                        temp,
                        windSpeed,
                        windDir,
                        cloudCover,
                        precip,
                        code,
                        isDay,
                    } = w;

                    const isSnow =
                        (code >= 71 && code <= 77) ||
                        code === 85 ||
                        code === 86;
                    const isRain =
                        !isSnow &&
                        ((code >= 51 && code <= 67) ||
                            (code >= 80 && code <= 82));
                    const isStorm = code >= 95 && code <= 99;

                    /* season from month (n-hemisphere; flip if lat < 0) */
                    const month = new Date().getMonth(); // 0-based
                    const south = (w.lat || 0) < 0;
                    const mAdj = south ? (month + 6) % 12 : month;
                    const season =
                        mAdj <= 1 || mAdj === 11
                            ? "winter"
                            : mAdj <= 4
                              ? "spring"
                              : mAdj <= 7
                                ? "summer"
                                : "fall";

                    const hour = new Date().getHours();
                    const min = new Date().getMinutes();
                    const tod = hour + min / 60; // 0–24

                    /* wind helpers (meteorological: dir = FROM) */
                    const windRad = sk.radians(windDir); // FROM direction
                    const cloudDriftX = -Math.sin(windRad); // clouds drift opposite (TO direction)
                    const cloudDriftY = Math.cos(windRad) * 0.18;
                    const wf = Math.min(windSpeed / 25, 1.4); // wind factor 0–1.4

                    /* particles */
                    const NPART = isRain ? 280 : isSnow ? 180 : 0;
                    let particles = [];

                    /* clouds */
                    let clouds = [];

                    /* grass blades */
                    let grass = [];

                    /* fallen leaves */
                    let gLeaves = [];

                    /* animation tick */
                    let t = 0;
                    let ltTimer = 0;

                    /* ── setup ─────────────────────────────────────────────── */
                    sk.setup = () => {
                        const cnv = sk.createCanvas(sk.windowWidth, sk.windowHeight);
                        cnv.parent(document.body);
                        sk.frameRate(30);
                        sk.noSmooth(); // pixel-crisp for fine lines

                        /* particles */
                        for (let i = 0; i < NPART; i++)
                            particles.push(mkParticle(true));

                        /* clouds */
                        const nc =
                            Math.round(cloudCover / 18) +
                            (isRain || isSnow ? 2 : 0) +
                            (isStorm ? 2 : 0);
                        for (let i = 0; i < Math.min(nc, 7); i++) {
                            clouds.push({
                                x: sk.random(W),
                                y: sk.random(H * 0.05, H * 0.28),
                                w: sk.random(130, 260),
                                h: sk.random(45, 85),
                                spd:
                                    sk.random(0.25, 0.65) *
                                    Math.max(windSpeed / 12, 0.15),
                                op: sk.random(180, 245),
                            });
                        }

                        /* grass */
                        for (let i = 0; i < 150; i++) {
                            const gx = sk.random(W);
                            if (gx > W * 0.36 && gx < W * 0.64) continue; // skip house footprint
                            grass.push({
                                x: gx,
                                y: GND + sk.random(0, 22),
                                h: sk.random(9, 22),
                                ph: sk.random(sk.TWO_PI),
                                sw: sk.random(1, 2.5),
                            });
                        }

                        /* ground leaves in fall */
                        if (season === "fall") {
                            for (let i = 0; i < 50; i++) {
                                gLeaves.push({
                                    x: sk.random(W),
                                    y: GND + sk.random(6, 35),
                                    sz: sk.random(7, 13),
                                    rot: sk.random(sk.TWO_PI),
                                    spd: sk.random(0.02, 0.1) * wf + 0.02,
                                    col: sk.random([
                                        [190, 75, 20],
                                        [210, 110, 25],
                                        [230, 150, 35],
                                        [165, 50, 15],
                                        [200, 60, 10],
                                    ]),
                                });
                            }
                        }
                    };

                    /* ── responsive scale helpers ──────────────────────────── */
                    sk.windowResized = () => {
                        sk.resizeCanvas(sk.windowWidth, sk.windowHeight);
                    };

                    function sceneTransform() {
                        const sf = Math.min(sk.windowWidth / W, sk.windowHeight / H);
                        const ox = (sk.windowWidth  - W * sf) / 2;
                        const oy = (sk.windowHeight - H * sf) / 2;
                        sk.translate(ox, oy);
                        sk.scale(sf);
                    }

                    /* ── draw ──────────────────────────────────────────────── */
                    sk.draw = () => {
                        t++;
                        sk.background(17); // fill letterbox with body bg colour
                        sk.push();
                        sceneTransform();
                        drawSky();
                        drawCelestial();
                        drawClouds();
                        if (isStorm) drawLightningMaybe();
                        drawGround();
                        drawTree(155, GND);
                        drawTree(640, GND);
                        drawHouse();
                        drawThermometer();
                        drawWeatherVane();
                        drawGrassLayer();
                        drawPrecipitation();
                        if (season === "fall") drawGroundLeaves();
                        sk.pop();
                    };

                    /* ══════════════════════════════════════════════════════
         SKY
      ══════════════════════════════════════════════════════ */
                    function drawSky() {
                        let tc, bc;
                        const night = isDay === 0;

                        if (night || tod < 5 || tod > 22.5) {
                            tc = sk.color(4, 7, 28);
                            bc = sk.color(12, 18, 48);
                        } else if (tod < 6.5) {
                            // pre-dawn → dawn
                            const f = (tod - 5) / 1.5;
                            tc = sk.lerpColor(
                                sk.color(4, 7, 28),
                                sk.color(35, 55, 115),
                                f,
                            );
                            bc = sk.lerpColor(
                                sk.color(12, 18, 48),
                                sk.color(210, 110, 55),
                                f,
                            );
                        } else if (tod < 8) {
                            // sunrise
                            const f = (tod - 6.5) / 1.5;
                            tc = sk.lerpColor(
                                sk.color(35, 55, 115),
                                sk.color(75, 135, 215),
                                f,
                            );
                            bc = sk.lerpColor(
                                sk.color(210, 110, 55),
                                sk.color(175, 205, 240),
                                f,
                            );
                        } else if (tod < 17) {
                            // day
                            if (cloudCover > 65) {
                                tc = sk.color(115, 125, 145);
                                bc = sk.color(155, 162, 172);
                            } else {
                                tc = sk.color(75, 135, 215);
                                bc = sk.color(175, 205, 240);
                            }
                        } else if (tod < 19.5) {
                            // sunset
                            const f = (tod - 17) / 2.5;
                            tc = sk.lerpColor(
                                sk.color(75, 135, 215),
                                sk.color(38, 55, 115),
                                f,
                            );
                            bc = sk.lerpColor(
                                sk.color(175, 205, 240),
                                sk.color(215, 95, 45),
                                f,
                            );
                        } else if (tod < 22) {
                            // dusk
                            const f = (tod - 19.5) / 2.5;
                            tc = sk.lerpColor(
                                sk.color(38, 55, 115),
                                sk.color(4, 7, 28),
                                f,
                            );
                            bc = sk.lerpColor(
                                sk.color(215, 95, 45),
                                sk.color(12, 18, 48),
                                f,
                            );
                        } else {
                            tc = sk.color(4, 7, 28);
                            bc = sk.color(12, 18, 48);
                        }

                        for (let y = 0; y < GND; y++) {
                            sk.stroke(sk.lerpColor(tc, bc, y / GND));
                            sk.line(0, y, W, y);
                        }
                        sk.noStroke();

                        // stars
                        const nightness = nightFactor();
                        if (nightness > 0) {
                            for (let i = 0; i < 90; i++) {
                                const sx = (i * 139.7 + 37) % W;
                                const sy = (i * 93.1 + 19) % (GND * 0.85);
                                const twk =
                                    0.65 + 0.35 * Math.sin(t * 0.04 + i * 2.3);
                                sk.fill(255, 255, 220, nightness * twk * 255);
                                sk.noStroke();
                                sk.ellipse(sx, sy, 2, 2);
                            }
                        }
                    }

                    function nightFactor() {
                        if (isDay === 0) return 1;
                        if (tod < 5 || tod > 22.5) return 1;
                        if (tod < 6.5) return 1 - (tod - 5) / 1.5;
                        if (tod > 21.5) return (tod - 21.5) / 1;
                        return 0;
                    }

                    /* ══════════════════════════════════════════════════════
         SUN / MOON
      ══════════════════════════════════════════════════════ */
                    function drawCelestial() {
                        const dayVisible = isDay === 1 && tod >= 6 && tod <= 20;
                        const nightVisible = isDay === 0 || tod < 6 || tod > 20;

                        if (dayVisible) {
                            const prog = (tod - 6) / 14;
                            const ang = sk.map(prog, 0, 1, sk.PI, 0);
                            const cx = W / 2;
                            const rx = W * 0.44,
                                ry = GND * 0.84;
                            const sx = cx + rx * Math.cos(ang);
                            const sy = GND - ry * Math.sin(ang);

                            // glow
                            for (let r = 70; r > 0; r -= 8) {
                                sk.fill(255, 235, 100, sk.map(r, 0, 70, 90, 0));
                                sk.noStroke();
                                sk.ellipse(sx, sy, r * 2, r * 2);
                            }
                            // disc
                            sk.fill(255, 218, 50);
                            sk.noStroke();
                            sk.ellipse(sx, sy, 52, 52);
                            // rays
                            sk.stroke(255, 230, 80, 160);
                            sk.strokeWeight(1.8);
                            for (let a = 0; a < sk.TWO_PI; a += sk.PI / 7) {
                                const rp = 3 * Math.sin(t * 0.025 + a);
                                sk.line(
                                    sx + Math.cos(a) * (30 + rp),
                                    sy + Math.sin(a) * (30 + rp),
                                    sx + Math.cos(a) * (46 + rp),
                                    sy + Math.sin(a) * (46 + rp),
                                );
                            }
                            sk.noStroke();
                        }

                        if (nightVisible) {
                            let prog;
                            if (tod >= 20) prog = (tod - 20) / 12;
                            else prog = (tod + 4) / 12;
                            prog = sk.constrain(prog, 0, 1);

                            const ang = sk.map(prog, 0, 1, sk.PI, 0);
                            const cx = W / 2;
                            const rx = W * 0.4,
                                ry = GND * 0.76;
                            const mx = cx + rx * Math.cos(ang);
                            const my = GND - ry * Math.sin(ang);

                            // glow
                            for (let r = 45; r > 0; r -= 7) {
                                sk.fill(180, 210, 255, sk.map(r, 0, 45, 55, 0));
                                sk.noStroke();
                                sk.ellipse(mx, my, r * 2, r * 2);
                            }
                            // moon disc
                            sk.fill(238, 244, 215);
                            sk.noStroke();
                            sk.ellipse(mx, my, 38, 38);
                            // crescent shadow
                            sk.fill(12, 18, 48);
                            sk.noStroke();
                            sk.ellipse(mx + 11, my, 32, 34);
                        }
                    }

                    /* ══════════════════════════════════════════════════════
         CLOUDS
      ══════════════════════════════════════════════════════ */
                    function drawClouds() {
                        for (const c of clouds) {
                            c.x += cloudDriftX * c.spd;
                            c.y += cloudDriftY * c.spd * 0.1;
                            if (c.x > W + c.w) c.x = -c.w;
                            if (c.x < -c.w) c.x = W + c.w;
                            drawCloud(c.x, c.y, c.w, c.h, c.op);
                        }
                    }

                    function drawCloud(x, y, cw, ch, op) {
                        const dark = isRain || isSnow || isStorm;
                        const r = dark ? 95 : 238;
                        const g = dark ? 98 : 238;
                        const b = dark ? 118 : 252;
                        sk.fill(r, g, b, op);
                        sk.noStroke();
                        sk.ellipse(x, y, cw, ch);
                        sk.ellipse(
                            x - cw * 0.26,
                            y + ch * 0.12,
                            cw * 0.62,
                            ch * 0.78,
                        );
                        sk.ellipse(
                            x + cw * 0.26,
                            y + ch * 0.12,
                            cw * 0.62,
                            ch * 0.78,
                        );
                        sk.ellipse(
                            x - cw * 0.08,
                            y - ch * 0.22,
                            cw * 0.48,
                            ch * 0.66,
                        );
                        sk.ellipse(
                            x + cw * 0.18,
                            y - ch * 0.16,
                            cw * 0.42,
                            ch * 0.58,
                        );
                    }

                    /* ══════════════════════════════════════════════════════
         GROUND
      ══════════════════════════════════════════════════════ */
                    function drawGround() {
                        let gt, gb;
                        const snowy =
                            isSnow || (season === "winter" && temp < 34);
                        if (snowy) {
                            gt = sk.color(238, 244, 255);
                            gb = sk.color(198, 212, 240);
                        } else if (season === "fall") {
                            gt = sk.color(95, 85, 38);
                            gb = sk.color(72, 65, 28);
                        } else if (season === "spring") {
                            gt = sk.color(78, 158, 58);
                            gb = sk.color(48, 118, 38);
                        } else {
                            gt = sk.color(55, 135, 45);
                            gb = sk.color(38, 105, 32);
                        }

                        for (let y = GND; y < H; y++) {
                            sk.stroke(
                                sk.lerpColor(gt, gb, (y - GND) / (H - GND)),
                            );
                            sk.line(0, y, W, y);
                        }
                        sk.noStroke();

                        // path
                        sk.fill(155, 145, 128);
                        sk.noStroke();
                        sk.beginShape();
                        sk.vertex(W * 0.435, GND);
                        sk.vertex(W * 0.565, GND);
                        sk.vertex(W * 0.655, H);
                        sk.vertex(W * 0.345, H);
                        sk.endShape(sk.CLOSE);
                        // path seam
                        sk.stroke(140, 130, 112);
                        sk.strokeWeight(1);
                        sk.line(W * 0.5, GND, W * 0.5, H);
                        sk.noStroke();

                        // snow accumulation
                        if (snowy) {
                            sk.fill(248, 252, 255, 210);
                            sk.noStroke();
                            sk.ellipse(W * 0.28, GND + 5, 210, 22);
                            sk.ellipse(W * 0.72, GND + 5, 160, 18);
                            sk.ellipse(W * 0.5, GND + 3, 320, 16);
                        }
                    }

                    /* ══════════════════════════════════════════════════════
         TREES
      ══════════════════════════════════════════════════════ */
                    function drawTree(x, baseY) {
                        const trunkH = 85,
                            trunkW = 15;
                        const sway = Math.sin(t * 0.033) * wf * 9;

                        if (season !== "winter") {
                            // ── leafy canopy (drawn first so trunk renders on top) ──
                            let lc, lcDark, lcLight;
                            if (season === "spring") {
                                lc = sk.color(88, 188, 68, 218);
                                lcDark = sk.color(52, 138, 40, 218);
                                lcLight = sk.color(145, 225, 112, 185);
                            } else if (season === "summer") {
                                lc = sk.color(35, 128, 35, 218);
                                lcDark = sk.color(18, 88, 18, 218);
                                lcLight = sk.color(62, 168, 62, 185);
                            } else {
                                lc = sk.color(188, 85, 16, 218);
                                lcDark = sk.color(138, 52, 8, 218);
                                lcLight = sk.color(228, 138, 42, 185);
                            }

                            const ls = sway * 1.4;
                            // canopy center: drop it low enough to clearly overlap the trunk top
                            const cy = baseY - trunkH - 18;

                            sk.noStroke();

                            // shadow layer — same clusters shifted slightly down & darker
                            sk.fill(lcDark);
                            for (let i = 0; i < 10; i++) {
                                const a = (i / 10) * sk.TWO_PI;
                                const lx =
                                    x +
                                    Math.cos(a) * 36 +
                                    ls * Math.sin(a + t * 0.045);
                                const ly = cy + Math.sin(a) * 20 + 5;
                                sk.ellipse(lx, ly, 56, 44);
                            }
                            sk.ellipse(x + ls * 0.5, cy + 5, 70, 60);

                            // main canopy
                            sk.fill(lc);
                            for (let i = 0; i < 10; i++) {
                                const a = (i / 10) * sk.TWO_PI;
                                const lx =
                                    x +
                                    Math.cos(a) * 36 +
                                    ls * Math.sin(a + t * 0.045);
                                const ly = cy + Math.sin(a) * 20;
                                const lw =
                                    58 + Math.sin(a + t * 0.038) * wf * 11;
                                const lh =
                                    46 + Math.cos(a + t * 0.031) * wf * 8;
                                sk.ellipse(lx, ly, lw, lh);
                            }
                            sk.ellipse(x + ls * 0.5, cy, 74, 62);

                            // highlight layer — lighter puffs on upper portion
                            sk.fill(lcLight);
                            for (let i = 0; i < 7; i++) {
                                const a = (i / 7) * sk.PI - sk.PI * 0.1; // upper half arc
                                const lx = x + Math.cos(a) * 22 + ls * 0.6;
                                const ly = cy - 10 + Math.sin(a) * 12;
                                sk.ellipse(lx, ly, 30, 22);
                            }

                            // falling leaves in autumn
                            if (season === "fall") {
                                for (let i = 0; i < 4; i++) {
                                    const fl = (t * 0.45 + i * 38) % 110;
                                    const fx =
                                        x +
                                        Math.sin(fl * 0.18 + i) * 35 * wf +
                                        ls;
                                    const fy = baseY - trunkH - 55 + fl * 1.4;
                                    if (fy < baseY) {
                                        sk.push();
                                        sk.translate(fx, fy);
                                        sk.rotate(fl * 0.12);
                                        sk.fill(
                                            195 + i * 8,
                                            82 + i * 5,
                                            18,
                                            200,
                                        );
                                        sk.noStroke();
                                        sk.ellipse(0, 0, 10, 7);
                                        sk.pop();
                                    }
                                }
                            }
                        }

                        // ── trunk with bark texture (drawn after canopy so it sits in front) ──
                        sk.fill(75, 50, 26);
                        sk.noStroke();
                        sk.rect(
                            x - trunkW / 2,
                            baseY - trunkH,
                            trunkW,
                            trunkH,
                            3,
                            3,
                            0,
                            0,
                        );

                        // bark — vertical grain lines
                        sk.strokeWeight(1);
                        for (
                            let bx = x - trunkW / 2 + 3;
                            bx < x + trunkW / 2 - 1;
                            bx += 3.5
                        ) {
                            const grain = Math.sin(bx * 5.3 + x) * 0.5 + 0.5;
                            sk.stroke(
                                grain > 0.5
                                    ? sk.color(55, 34, 14)
                                    : sk.color(92, 62, 32),
                            );
                            const segH = trunkH * (0.5 + grain * 0.45);
                            sk.line(
                                bx + Math.sin(bx * 2.1) * 1.2,
                                baseY - 2,
                                bx + Math.sin(bx * 1.7) * 1.5,
                                baseY - segH,
                            );
                        }
                        // right-edge highlight
                        sk.stroke(105, 74, 40);
                        sk.strokeWeight(1.5);
                        sk.line(
                            x + trunkW / 2 - 3,
                            baseY - 6,
                            x + trunkW / 2 - 3,
                            baseY - trunkH + 10,
                        );
                        sk.noStroke();

                        if (season === "winter") {
                            // bare branches
                            sk.stroke(68, 46, 24);
                            const br = [
                                [0, -trunkH, sway, -trunkH - 40],
                                [sway, -trunkH - 40, sway + 23, -trunkH - 68],
                                [sway, -trunkH - 40, sway - 21, -trunkH - 63],
                                [
                                    sway + 23,
                                    -trunkH - 68,
                                    sway + 33,
                                    -trunkH - 90,
                                ],
                                [
                                    sway + 23,
                                    -trunkH - 68,
                                    sway + 13,
                                    -trunkH - 87,
                                ],
                                [
                                    sway - 21,
                                    -trunkH - 63,
                                    sway - 32,
                                    -trunkH - 84,
                                ],
                                [
                                    sway - 21,
                                    -trunkH - 63,
                                    sway - 10,
                                    -trunkH - 81,
                                ],
                            ];
                            for (let i = 0; i < br.length; i++) {
                                sk.strokeWeight(i < 1 ? 4 : i < 3 ? 2.5 : 1.5);
                                sk.line(
                                    x + br[i][0],
                                    baseY + br[i][1],
                                    x + br[i][2],
                                    baseY + br[i][3],
                                );
                            }
                            sk.noStroke();
                            // snow on branches
                            sk.fill(245, 250, 255, 185);
                            sk.ellipse(x + sway, baseY - trunkH - 44, 30, 8);
                            sk.ellipse(
                                x + sway + 18,
                                baseY - trunkH - 70,
                                20,
                                7,
                            );
                            sk.ellipse(
                                x + sway - 16,
                                baseY - trunkH - 65,
                                17,
                                6,
                            );
                        }
                    }

                    /* ══════════════════════════════════════════════════════
         HOUSE
      ══════════════════════════════════════════════════════ */
                    function drawHouse() {
                        const hcx = W * 0.5;
                        const hcy = GND; // base y
                        const hw = 210;
                        const hh = 155;
                        const rh = 95;

                        // siding
                        sk.fill(218, 198, 168);
                        sk.stroke(178, 158, 128);
                        sk.strokeWeight(1.8);
                        sk.rect(hcx - hw / 2, hcy - hh, hw, hh);

                        // siding planks
                        sk.stroke(195, 178, 148);
                        sk.strokeWeight(0.8);
                        for (let py = hcy - hh + 14; py < hcy; py += 14) {
                            sk.line(hcx - hw / 2, py, hcx + hw / 2, py);
                        }

                        // roof
                        sk.fill(138, 76, 56);
                        sk.stroke(108, 58, 42);
                        sk.strokeWeight(2);
                        sk.triangle(
                            hcx - hw / 2 - 16,
                            hcy - hh,
                            hcx + hw / 2 + 16,
                            hcy - hh,
                            hcx,
                            hcy - hh - rh,
                        );

                        // roof ridge
                        sk.stroke(95, 50, 36);
                        sk.strokeWeight(3);
                        sk.line(
                            hcx - hw / 2 - 16,
                            hcy - hh,
                            hcx + hw / 2 + 16,
                            hcy - hh,
                        );
                        sk.noStroke();

                        // chimney
                        sk.fill(158, 98, 78);
                        sk.noStroke();
                        sk.rect(hcx + 38, hcy - hh - rh + 18, 30, 64, 3);
                        sk.fill(108, 64, 50);
                        sk.rect(hcx + 35, hcy - hh - rh + 14, 36, 9, 3);

                        // smoke (cold weather)
                        if (
                            temp < 52 ||
                            season === "winter" ||
                            season === "fall"
                        ) {
                            const wd = windDir > 180 ? -1 : 1;
                            for (let i = 0; i < 5; i++) {
                                const sp = (t * 0.45 + i * 18) % 70;
                                const sx =
                                    hcx +
                                    53 +
                                    Math.sin(sp * 0.14 + i) * 9 * wf * wd;
                                const sy = hcy - hh - rh + 12 - sp * 1.4;
                                const sa = sk.map(sp, 0, 70, 145, 0);
                                sk.fill(195, 195, 200, sa);
                                sk.noStroke();
                                sk.ellipse(
                                    sx,
                                    sy,
                                    sp * 0.45 + 6,
                                    sp * 0.45 + 6,
                                );
                            }
                        }

                        // door
                        sk.fill(95, 65, 36);
                        sk.stroke(65, 45, 25);
                        sk.strokeWeight(1.5);
                        sk.rect(hcx - 22, hcy - 72, 44, 72, 5, 5, 0, 0);
                        // door panel detail
                        sk.stroke(75, 52, 28);
                        sk.strokeWeight(1);
                        sk.rect(hcx - 15, hcy - 65, 12, 16, 2);
                        sk.rect(hcx + 3, hcy - 65, 12, 16, 2);
                        sk.rect(hcx - 15, hcy - 44, 12, 16, 2);
                        sk.rect(hcx + 3, hcy - 44, 12, 16, 2);
                        // knob
                        sk.fill(195, 165, 48);
                        sk.noStroke();
                        sk.ellipse(hcx + 16, hcy - 36, 7, 7);

                        // windows
                        drawWindow(hcx - 82, hcy - 128);
                        drawWindow(hcx + 36, hcy - 128);

                        // shrubs flanking door
                        drawShrub(hcx - 42, hcy);
                        drawShrub(hcx + 42, hcy);

                        // foundation
                        sk.fill(175, 158, 135);
                        sk.stroke(148, 132, 112);
                        sk.strokeWeight(1);
                        sk.rect(hcx - hw / 2, hcy - 9, hw, 9, 0, 0, 2, 2);
                    }

                    function drawWindow(wx, wy) {
                        const ww = 46,
                            wh = 40;
                        // frame
                        sk.fill(175, 195, 218);
                        sk.stroke(118, 98, 76);
                        sk.strokeWeight(2);
                        sk.rect(wx, wy, ww, wh, 3);
                        // glazing bars
                        sk.stroke(118, 98, 76);
                        sk.strokeWeight(1.5);
                        sk.line(wx + ww / 2, wy, wx + ww / 2, wy + wh);
                        sk.line(wx, wy + wh / 2, wx + ww, wy + wh / 2);
                        // night glow
                        if (isDay === 0 || tod < 7 || tod > 20) {
                            sk.fill(255, 238, 175, 145);
                            sk.noStroke();
                            sk.rect(wx + 2, wy + 2, ww - 4, wh - 4, 2);
                        }
                    }

                    function drawShrub(cx, baseY) {
                        const sw = Math.sin(t * 0.038 + cx * 0.05) * wf * 5;

                        // seasonal colours
                        let sc, scDark, scLight;
                        const snowy = season === "winter" && temp < 34;
                        if (snowy) {
                            sc = sk.color(58, 115, 42, 220);
                            scDark = sk.color(35, 80, 25, 220);
                            scLight = sk.color(245, 250, 255, 200);
                        } else if (season === "fall") {
                            sc = sk.color(175, 75, 15, 220);
                            scDark = sk.color(125, 45, 8, 220);
                            scLight = sk.color(218, 128, 38, 185);
                        } else if (season === "spring") {
                            sc = sk.color(75, 175, 55, 220);
                            scDark = sk.color(42, 125, 30, 220);
                            scLight = sk.color(135, 215, 98, 185);
                        } else {
                            sc = sk.color(42, 138, 35, 220);
                            scDark = sk.color(22, 95, 18, 220);
                            scLight = sk.color(68, 175, 55, 185);
                        }

                        sk.noStroke();

                        // shadow layer
                        sk.fill(scDark);
                        sk.ellipse(cx + sw * 0.3, baseY - 14, 44, 28);
                        sk.ellipse(cx - 14 + sw * 0.2, baseY - 10, 28, 22);
                        sk.ellipse(cx + 14 + sw * 0.4, baseY - 10, 28, 22);

                        // main mass
                        sk.fill(sc);
                        sk.ellipse(cx + sw, baseY - 16, 46, 30);
                        sk.ellipse(cx - 13 + sw * 0.5, baseY - 12, 30, 24);
                        sk.ellipse(cx + 13 + sw * 0.8, baseY - 12, 30, 24);

                        // highlights
                        sk.fill(scLight);
                        sk.ellipse(cx - 5 + sw * 0.6, baseY - 22, 20, 14);
                        sk.ellipse(cx + 8 + sw * 0.7, baseY - 20, 16, 11);

                        // snow cap in winter
                        if (snowy) {
                            sk.fill(245, 250, 255, 200);
                            sk.ellipse(cx + sw * 0.5, baseY - 23, 34, 10);
                            sk.ellipse(cx - 10 + sw * 0.3, baseY - 18, 18, 7);
                            sk.ellipse(cx + 12 + sw * 0.6, baseY - 18, 15, 6);
                        }
                    }

                    /* ══════════════════════════════════════════════════════
         THERMOMETER  (on right wall of house)
      ══════════════════════════════════════════════════════ */
                    function drawThermometer() {
                        const hcx = W * 0.5;
                        const tx = hcx + 118;
                        const ty = GND - 82;
                        const tH = 58;
                        const tW = 11;

                        // mount plate
                        sk.fill(198, 182, 158);
                        sk.noStroke();
                        sk.rect(tx - 14, ty - 6, 28, tH + 22, 5);

                        // glass tube
                        sk.fill(238, 228, 212);
                        sk.stroke(175, 158, 138);
                        sk.strokeWeight(1);
                        sk.rect(tx - tW / 2, ty, tW, tH, tW / 2, tW / 2, 0, 0);

                        // bulb
                        sk.fill(198, 48, 48);
                        sk.stroke(155, 28, 28);
                        sk.strokeWeight(1);
                        sk.ellipse(tx, ty + tH + 8, 17, 17);

                        // mercury column
                        const mH = sk.map(
                            sk.constrain(temp, -20, 120),
                            -20,
                            120,
                            0,
                            tH,
                        );
                        sk.fill(198, 48, 48);
                        sk.noStroke();
                        sk.rect(
                            tx - tW / 2 + 2,
                            ty + tH - mH,
                            tW - 4,
                            mH + 8,
                            2,
                            2,
                            0,
                            0,
                        );

                        // tick marks & labels
                        sk.stroke(108, 88, 68);
                        sk.strokeWeight(1);
                        sk.fill(55, 38, 18);
                        sk.textSize(7.5);
                        sk.textAlign(sk.LEFT, sk.CENTER);
                        const labels = [-20, 0, 20, 40, 60, 80, 100, 120];
                        for (const tv of labels) {
                            const yt = ty + tH - sk.map(tv, -20, 120, 0, tH);
                            sk.stroke(108, 88, 68);
                            sk.line(tx + tW / 2, yt, tx + tW / 2 + 5, yt);
                            sk.noStroke();
                            sk.fill(55, 38, 18);
                            sk.text(tv, tx + tW / 2 + 7, yt);
                        }

                        // current temp readout
                        sk.noStroke();
                        sk.fill(55, 38, 18);
                        sk.textSize(9);
                        sk.textAlign(sk.CENTER);
                        sk.text(`${Math.round(temp)}°F`, tx, ty - 8);
                    }

                    /* ══════════════════════════════════════════════════════
         WEATHER VANE  (on roof peak)
      ══════════════════════════════════════════════════════ */
                    function drawWeatherVane() {
                        const hcx = W * 0.5;
                        const hcy = GND;
                        const hh = 155,
                            rh = 95;
                        const vx = hcx;
                        const vy = hcy - hh - rh; // roof peak
                        const pole = 38;

                        // pole
                        sk.stroke(88, 70, 50);
                        sk.strokeWeight(2.5);
                        sk.line(vx, vy, vx, vy - pole);
                        sk.noStroke();

                        // cardinal N-S-E-W arms (fixed)
                        sk.stroke(72, 58, 40);
                        sk.strokeWeight(1.2);
                        sk.line(vx - 14, vy - pole, vx + 14, vy - pole);
                        sk.line(vx, vy - pole - 12, vx, vy - pole + 12);
                        sk.fill(58, 42, 28);
                        sk.noStroke();
                        sk.textSize(8);
                        sk.textAlign(sk.CENTER, sk.CENTER);
                        sk.text("N", vx, vy - pole - 18);
                        sk.text("S", vx, vy - pole + 18);
                        sk.text("E", vx + 20, vy - pole);
                        sk.text("W", vx - 20, vy - pole);

                        // vane rotates: points to FROM direction (traditional weather vane)
                        // meteorological windDir = degrees FROM; arrow head points FROM direction
                        // p5.js: angle 0 = right, CW positive
                        // wind from North (0°) → head points up → p5 angle = -PI/2
                        const vaneAngle = sk.radians(windDir) - sk.HALF_PI;
                        // gentle animated wobble proportional to wind
                        const wobble = Math.sin(t * 0.05) * wf * 0.08;

                        sk.push();
                        sk.translate(vx, vy - pole);
                        sk.rotate(vaneAngle + wobble);

                        // arrow shaft
                        sk.stroke(52, 52, 52);
                        sk.strokeWeight(2);
                        sk.line(-24, 0, 24, 0);

                        // arrowhead (points INTO wind / FROM direction)
                        sk.fill(52, 52, 52);
                        sk.noStroke();
                        sk.triangle(16, -5, 16, 5, 28, 0);

                        // tail fin (pushed by wind)
                        sk.fill(175, 38, 38);
                        sk.noStroke();
                        sk.triangle(-16, -4, -16, 4, -28, -11);
                        sk.triangle(-16, -4, -16, 4, -28, 11);

                        sk.pop();
                    }

                    /* ══════════════════════════════════════════════════════
         GRASS & FLOWERS
      ══════════════════════════════════════════════════════ */
                    function drawGrassLayer() {
                        // blades
                        for (const g of grass) {
                            const sw = Math.sin(t * 0.042 + g.ph) * wf * 14;
                            let gc;
                            if (season === "winter" && temp < 34)
                                gc = sk.color(215, 225, 242);
                            else if (season === "fall")
                                gc = sk.color(118, 98, 45);
                            else if (season === "spring")
                                gc = sk.color(98, 195, 68);
                            else gc = sk.color(65, 152, 48);
                            sk.stroke(gc);
                            sk.strokeWeight(g.sw);
                            sk.line(g.x, g.y, g.x + sw, g.y - g.h);
                            sk.noStroke();
                        }

                        // flowers spring/summer
                        if (season === "spring" || season === "summer") {
                            const pals = [
                                [252, 198, 50],
                                [252, 115, 148],
                                [198, 98, 198],
                                [252, 158, 58],
                                [148, 198, 252],
                            ];
                            for (let i = 0; i < 18; i++) {
                                const fx = ((i * 109 + 185) % (W - 120)) + 60;
                                if (fx > W * 0.33 && fx < W * 0.67) continue;
                                const fy = GND + ((i * 71) % 28) + 6;
                                const sw =
                                    Math.sin(t * 0.042 + i * 1.3) * wf * 7;
                                // stem
                                sk.stroke(55, 142, 38);
                                sk.strokeWeight(1.5);
                                sk.line(fx, fy, fx + sw, fy - 17);
                                // petals
                                const pc = pals[i % pals.length];
                                sk.fill(pc[0], pc[1], pc[2], 215);
                                sk.noStroke();
                                for (let a = 0; a < sk.TWO_PI; a += sk.PI / 3) {
                                    sk.ellipse(
                                        fx + sw + Math.cos(a) * 5.5,
                                        fy - 17 + Math.sin(a) * 5.5,
                                        7.5,
                                        5.5,
                                    );
                                }
                                sk.fill(255, 238, 95);
                                sk.ellipse(fx + sw, fy - 17, 6.5, 6.5);
                            }
                        }
                    }

                    /* ══════════════════════════════════════════════════════
         PRECIPITATION
      ══════════════════════════════════════════════════════ */
                    function mkParticle(scatter) {
                        const driftX =
                            -Math.sin(windRad) * wf * (isRain ? 3.5 : 1.5);
                        return {
                            x: scatter ? sk.random(W) : sk.random(-20, W + 20),
                            y: scatter ? sk.random(-H, 0) : -10,
                            spd: isRain ? sk.random(10, 18) : sk.random(1, 3.5),
                            dx:
                                driftX +
                                (isSnow
                                    ? Math.sin(sk.random(sk.TWO_PI)) * 0.4
                                    : 0),
                            sz: isRain ? sk.random(1, 2) : sk.random(3.5, 8),
                            op: sk.random(140, 245),
                        };
                    }

                    function drawPrecipitation() {
                        if (!particles.length) return;
                        for (let i = particles.length - 1; i >= 0; i--) {
                            const p = particles[i];
                            p.y += p.spd;
                            p.x += p.dx;
                            if (p.y > H || p.x < -20 || p.x > W + 20) {
                                particles[i] = mkParticle(false);
                                continue;
                            }
                            if (isRain) {
                                sk.stroke(145, 178, 215, p.op);
                                sk.strokeWeight(p.sz);
                                sk.line(p.x, p.y, p.x + p.dx * 2, p.y - 9);
                            } else if (isSnow) {
                                sk.fill(238, 246, 255, p.op);
                                sk.noStroke();
                                sk.ellipse(p.x, p.y, p.sz, p.sz);
                            }
                        }
                        sk.noStroke();
                    }

                    /* ══════════════════════════════════════════════════════
         LIGHTNING
      ══════════════════════════════════════════════════════ */
                    function drawLightningMaybe() {
                        ltTimer--;
                        if (ltTimer > 0) return;
                        ltTimer = Math.round(sk.random(55, 210));
                        if (sk.random() > 0.28) return;

                        const lx = sk.random(W * 0.15, W * 0.85);
                        sk.push();
                        sk.stroke(255, 255, 200, 210);
                        sk.strokeWeight(1.8);
                        bolt(lx, 30, lx + sk.random(-25, 25), GND - 45, 5);
                        sk.pop();
                    }

                    function bolt(x1, y1, x2, y2, depth) {
                        if (depth <= 0 || y1 >= y2) return;
                        const mx = (x1 + x2) / 2 + sk.random(-35, 35);
                        const my = (y1 + y2) / 2;
                        sk.line(x1, y1, mx, my);
                        sk.line(mx, my, x2, y2);
                        if (depth > 2) {
                            bolt(
                                mx,
                                my,
                                x2 + sk.random(-18, 18),
                                y2,
                                depth - 1,
                            );
                        }
                    }

                    /* ══════════════════════════════════════════════════════
         GROUND LEAVES (fall)
      ══════════════════════════════════════════════════════ */
                    function drawGroundLeaves() {
                        for (const l of gLeaves) {
                            l.x +=
                                l.spd * (1 + 0.4 * Math.sin(t * 0.022 + l.y));
                            l.rot += l.spd * 0.4;
                            if (l.x > W + 15) l.x = -15;
                            sk.push();
                            sk.translate(l.x, l.y);
                            sk.rotate(l.rot);
                            sk.fill(l.col[0], l.col[1], l.col[2], 195);
                            sk.noStroke();
                            sk.ellipse(0, 0, l.sz, l.sz * 0.62);
                            sk.pop();
                        }
                    }
                }); // end p5
            } // end startSketch

            init();
        </script>
    </body>
